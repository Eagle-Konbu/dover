name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Run tests
        run: task test

      - name: Build and package Lambda
        run: task package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: task init

      - name: Terraform Plan
        run: task plan
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_octopus_account_number: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}

      - name: Terraform Apply
        run: task apply-ci
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_octopus_account_number: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}

      - name: Update Octopus Energy credentials
        env:
          OCTOPUS_EMAIL: ${{ secrets.OCTOPUS_EMAIL }}
          OCTOPUS_PASSWORD: ${{ secrets.OCTOPUS_PASSWORD }}
        run: |
          SECRET_ARN=$(cd terraform && terraform output -raw secret_arn)
          SECRET_STRING=$(jq -n --arg email "$OCTOPUS_EMAIL" --arg password "$OCTOPUS_PASSWORD" \
            '{email: $email, password: $password}')
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$SECRET_STRING"
