name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1.1.0

      - name: Run tests
        run: task test

      - name: Build and package Lambda
        run: task package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: task init

      - name: Terraform Plan
        run: task plan
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_octopus_account_number: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}

      - name: Terraform Apply
        run: task apply-ci
        env:
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_octopus_account_number: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}

      - name: Update Octopus Energy credentials
        env:
          OCTOPUS_EMAIL: ${{ secrets.OCTOPUS_EMAIL }}
          OCTOPUS_PASSWORD: ${{ secrets.OCTOPUS_PASSWORD }}
        run: |
          SECRET_ARN=$(cd terraform && terraform output -raw secret_arn)
          SECRET_STRING=$(jq -n --arg email "$OCTOPUS_EMAIL" --arg password "$OCTOPUS_PASSWORD" \
            '{email: $email, password: $password}')
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$SECRET_STRING"
