name: Terraform CI

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
      - 'Taskfile.yml'

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Setup Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1.1.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Build and package Lambda
        run: task package

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  lint:
    name: Lint (TFLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: TFLint Init
        run: tflint --init
        working-directory: terraform

      - name: TFLint Run
        run: tflint --format compact
        working-directory: terraform

  security:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Post tfsec findings
        uses: aquasecurity/tfsec-pr-commenter-action@7a44c5dcde5dfab737363e391800629e27b6376b # v1.3.1
        with:
          working_directory: terraform
          soft_fail_commenter: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check required_version constraint
        run: |
          if ! grep -q 'required_version' terraform/versions.tf 2>/dev/null; then
            echo "::error::required_version constraint not found in terraform/versions.tf"
            exit 1
          fi

          CONSTRAINT=$(grep 'required_version' terraform/versions.tf | sed 's/.*"\(.*\)".*/\1/')
          echo "Found version constraint: $CONSTRAINT"

          if echo "$CONSTRAINT" | grep -qE '^[><=~!]+\s' || echo "$CONSTRAINT" | grep -qE '^\s*$'; then
            echo "::warning::Version constraint '$CONSTRAINT' may not be specific enough. Consider using an exact version or tight range."
          fi
